[package]
name = "kalam"
version = "0.1.0"
edition = "2021"
description = "Kalam — a lightweight personal ebook manager and reader for Linux"
license = "GPL-3.0-or-later"
authors = ["Kalam Contributors"]
repository = "https://github.com/alankarter1275/calibre-alt"
default-run = "kalam"

[dependencies]
relm4 = { version = "0.9", features = ["libadwaita", "gnome_45"] }
libadwaita = { version = "0.7", features = ["v1_4"] }
gtk = { version = "0.9", package = "gtk4", features = ["v4_12"] }
gdk-pixbuf = "0.20"
# A0 step 3: persistent cover thumbnails. gdk-pixbuf can decode but cannot
# encode PNG in this toolchain, so we use `image` (pure Rust, no system deps)
# to generate the small thumbnails written to cache/thumbs/ at import time.
# Default features are off to keep the binary lean; just the codecs covers
# need to decode (jpg/png/gif/webp) plus PNG to encode the thumbnail.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
webkit6 = { version = "0.4", package = "webkit6", features = ["v2_44"] }
javascriptcore = { version = "0.4", package = "javascriptcore6" }
glib = "0.20"
gio = { version = "0.20", package = "gio" }

# Library / persistence
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
# Text normalization: NFD for dictionary headword keys (diacritic-insensitive lookup)
unicode-normalization = "0.1"
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Metadata fetch (P5). rustls by default — no OpenSSL system dependency.
ureq = "2"
# Hands results from the fetch worker thread back to the GTK main context.
async-channel = "2"

# EPUB (zip + OPF XML)
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
quick-xml = "0.37"
flate2 = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
