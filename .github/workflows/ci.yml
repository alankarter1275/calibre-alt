# Compile-check Kalam on every push / PR.
# Headless: no display needed — we only cargo fmt/clippy/build.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (ubuntu)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libadwaita-1-dev libglib2.0-dev \
            libpango1.0-dev libgdk-pixbuf-2.0-dev \
            libgraphene-1.0-dev \
            libwebkitgtk-6.0-dev libsoup-3.0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Cargo.lock is committed (see the ROADMAP entry for 2026-09-04). The
      # Arena sandbox has no network route to crates.io, so the agent cannot
      # generate or refresh it there; this step is how the lockfile gets
      # created and how a legitimate dependency change gets recorded.
      #
      # `cargo generate-lockfile` only writes when the manifest and the lock
      # disagree, so on a normal run this is a no-op and commits nothing.
      - name: Cargo.lock (generate and push if missing or stale)
        run: |
          cargo generate-lockfile
          if git diff --quiet -- Cargo.lock && [ -z "$(git status --porcelain Cargo.lock)" ]; then
            echo "Cargo.lock: unchanged"
          else
            echo "Cargo.lock: updating and pushing"
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add -f Cargo.lock
            git commit -m "ci: update Cargo.lock [skip ci]"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
            git push origin "HEAD:$GITHUB_REF_NAME" || true
          fi

      - name: rustfmt (auto-fix and push if needed)
        run: |
          cargo fmt --all
          if git diff --quiet; then
            echo "rustfmt: clean"
          else
            echo "rustfmt: formatting and pushing fix"
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add -A
            git commit -m "style: rustfmt auto-fix"
            git push
          fi

      # The Arena sandbox cannot download Actions logs (the log host is
      # unreachable from it), so on failure we commit the compiler output back
      # to the branch under ci-logs/ where the agent can read it.
      # `-D warnings` turns every warning into an error, including plain rustc
      # ones like dead_code. Without it a warning could never fail a run: an
      # unused `pub fn` in src/service.rs sat through several "green" runs and
      # was only caught when a human read their own build output. `--all-targets`
      # compiles the bin, so unused items in the binary crate are reported.
      #
      # Trade-off, accepted deliberately: the toolchain is `stable`, so a new
      # Rust release that adds a lint can turn this red without the code
      # changing. The failure publishes to ci-logs/clippy-latest.txt, which the
      # agent can read, so that is recoverable rather than mysterious.
      - name: clippy
        id: clippy
        run: |
          set -o pipefail
          cargo clippy --all-targets --message-format=short -- -D warnings 2>&1 \
            | tee /tmp/clippy.txt
        continue-on-error: true

      - name: publish clippy log on failure
        if: steps.clippy.outcome == 'failure'
        run: |
          mkdir -p ci-logs
          # Prefer the diagnostic lines, but always fall back to the tail: a
          # grep that matches nothing used to publish an empty file, which is
          # worse than useless.
          grep -E "error|warning:" /tmp/clippy.txt | head -100 > ci-logs/clippy-latest.txt || true
          if [ ! -s ci-logs/clippy-latest.txt ]; then
            echo "(no lines matched; last 100 lines of output)" > ci-logs/clippy-latest.txt
            tail -100 /tmp/clippy.txt >> ci-logs/clippy-latest.txt || true
          fi
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/clippy-latest.txt
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f ci-logs/clippy-latest.txt
          git commit -m "ci: publish clippy failures [skip ci]" || true
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME" || true

      - name: fail if clippy failed
        if: steps.clippy.outcome == 'failure'
        run: exit 1

      # cargo test: compiles and RUNS the unit tests (in-memory SQLite —
      # headless, no display needed). Failures publish the diagnostics to
      # ci-logs/test-latest.txt, same pattern as clippy above.
      - name: test
        id: test
        run: |
          set -o pipefail
          cargo test --all-targets --message-format=short 2>&1 \
            | tee /tmp/test.txt
        continue-on-error: true

      - name: publish test log on failure
        if: steps.test.outcome == 'failure'
        run: |
          mkdir -p ci-logs
          grep -E "error|FAILED|panicked|test result" /tmp/test.txt \
            | head -100 > ci-logs/test-latest.txt || true
          if [ ! -s ci-logs/test-latest.txt ]; then
            echo "(no lines matched; last 100 lines of output)" > ci-logs/test-latest.txt
            tail -100 /tmp/test.txt >> ci-logs/test-latest.txt || true
          fi
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/test-latest.txt
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f ci-logs/test-latest.txt
          git commit -m "ci: publish test failures [skip ci]" || true
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME" || true

      - name: fail if tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1

      - name: build (debug)
        run: cargo build --verbose

      - name: build (release)
        run: cargo build --release

  # ---------------------------------------------------------------------------
  # Screenshots on a headless display.
  #
  # Why: the build job proves the code compiles. It has now been green through
  # two bugs that were obvious on screen -- Home's covers never loaded, and only
  # the first two rows of the grid ever filled. Neither is detectable without
  # looking at pixels.
  #
  # A SEPARATE job, on purpose:
  #   * `continue-on-error` so a flaky compositor can never block a correct
  #     change. This is a diagnostic, not a gate. CI remains the gate for
  #     compile/clippy/test only.
  #   * it needs `build` to pass first, so we never screenshot a broken tree.
  #
  # Read docs/ci/README-screenshots.md before trusting these images. Summary of
  # the caveats: the software (Cairo) renderer is NOT the renderer on a real
  # desktop, headless sway is one virtual output rather than a tiling session,
  # and the reader (WebKit) may not render at all here.
  # ---------------------------------------------------------------------------
  screenshots:
    name: screenshots (headless sway)
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    # Needed by "publish the screenshot report" below, which commits the
    # text summary back to the branch for the agent to read.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libadwaita-1-dev libglib2.0-dev \
            libpango1.0-dev libgdk-pixbuf-2.0-dev \
            libgraphene-1.0-dev \
            libwebkitgtk-6.0-dev libsoup-3.0-dev \
            sway grim wtype \
            xwayland \
            fonts-dejavu-core

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: build (release)
        run: cargo build --release

      # 139 books: matches the library the user actually measured on, so the
      # screenshots and the numbers describe the same thing.
      - name: screenshots
        run: |
          chmod +x docs/ci/screenshot.sh docs/ci/check-shot.py
          BOOKS=139 OUT=ci-shots docs/ci/screenshot.sh

      - name: upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: ci-shots/
          retention-days: 14
          if-no-files-found: warn

      # The Arena sandbox cannot download Actions artifacts -- the blob host is
      # unreachable from it, exactly like the Actions log host (which is why
      # clippy failures are committed to ci-logs/). The PNGs are for humans;
      # this text report is the only way the agent can see what happened.
      # Committed on success AND failure, because a failed screenshot run is
      # precisely when the diagnostics matter.
      - name: publish the screenshot report
        if: always()
        run: |
          mkdir -p ci-logs
          cp ci-shots/report.txt ci-logs/screenshots-latest.txt 2>/dev/null \
            || echo "(no report produced)" > ci-logs/screenshots-latest.txt
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/screenshots-latest.txt
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f ci-logs/screenshots-latest.txt
          git commit -m "ci: publish screenshot report [skip ci]" || true
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME" || true

  # ---------------------------------------------------------------------------
  # Scale check: 2,000 books.
  #
  # The A0 acceptance criterion is "the grid stays smooth at 2,000+ books" and
  # nobody has ever run this app at that size -- every decision about grid
  # virtualization so far has been extrapolated from a 139-book library, and
  # those extrapolations have been wrong repeatedly.
  #
  # Runner *timing* is noise (shared, throttled VMs), so this does not assert on
  # milliseconds. Peak RSS is far more stable and is the number that actually
  # decides whether the unbounded cover cache is a problem: at 128x204xRGBA,
  # 2,000 cached covers is ~200 MB that nothing ever evicts.
  # ---------------------------------------------------------------------------
  scale:
    name: scale check (2000 books)
    # Deliberately after `screenshots`, not in parallel: both jobs commit a
    # report to the same branch, and racing pushes means one of them loses.
    needs: [build, screenshots]
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libadwaita-1-dev libglib2.0-dev \
            libpango1.0-dev libgdk-pixbuf-2.0-dev \
            libgraphene-1.0-dev \
            libwebkitgtk-6.0-dev libsoup-3.0-dev \
            sway grim wtype \
            xwayland \
            fonts-dejavu-core

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: build (release)
        run: cargo build --release

      # The script samples the app's own RSS and writes peak-rss.txt; see the
      # comment in screenshot.sh for why /usr/bin/time cannot do this (sway is
      # the parent, not us). Longer settle: 2,000 covers take a while to warm.
      - name: run at 2000 books and record peak memory
        run: |
          chmod +x docs/ci/screenshot.sh docs/ci/check-shot.py
          BOOKS=2000 OUT=ci-shots-2000 SETTLE=60 docs/ci/screenshot.sh

      # A0 step 6: the same library again with the windowed grid switched on,
      # so the before/after comes from one machine in one run. Comparing
      # against a number from a previous run would be comparing two different
      # VMs -- the whole reason step 7 asserts query counts and not
      # milliseconds. Both reports are published side by side below.
      - name: run at 2000 books with the windowed grid
        run: |
          BOOKS=2000 OUT=ci-shots-2000-windowed SETTLE=60 WINDOWED=1 \
            docs/ci/screenshot.sh

      - name: upload scale artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scale-2000
          path: |
            ci-shots-2000/
            ci-shots-2000-windowed/
          retention-days: 14
          if-no-files-found: warn

      # Same reasoning as the screenshots job: the peak-memory number is the
      # whole point of this job, and it is useless if it can only be read by
      # downloading a zip the agent cannot reach.
      - name: publish the scale report
        if: always()
        run: |
          mkdir -p ci-logs
          cp ci-shots-2000/report.txt ci-logs/scale-2000-latest.txt 2>/dev/null \
            || echo "(no report produced)" > ci-logs/scale-2000-latest.txt
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/scale-2000-latest.txt
          cp ci-shots-2000-windowed/report.txt \
            ci-logs/scale-2000-windowed-latest.txt 2>/dev/null \
            || echo "(no report produced)" > ci-logs/scale-2000-windowed-latest.txt
          echo "--- run $GITHUB_RUN_ID ---" >> ci-logs/scale-2000-windowed-latest.txt
          # The one line that answers "did it work", so it is not buried in
          # two 60-line reports.
          {
            echo "=== A0 step 6: old grid vs windowed grid, 2,000 books ==="
            echo "old grid:"
            grep -E "peak_rss|grid_build|grid_cards" ci-logs/scale-2000-latest.txt \
              | sed 's/^/  /' || true
            echo "windowed grid:"
            grep -E "peak_rss|grid_build|grid_cards" \
              ci-logs/scale-2000-windowed-latest.txt | sed 's/^/  /' || true
          } > ci-logs/scale-2000-comparison.txt
          cat ci-logs/scale-2000-comparison.txt
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f ci-logs/scale-2000-latest.txt \
            ci-logs/scale-2000-windowed-latest.txt \
            ci-logs/scale-2000-comparison.txt
          git commit -m "ci: publish scale report [skip ci]" || true
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME" || true
