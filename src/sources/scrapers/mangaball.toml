id = "mangaball"
name = "Manga Ball (English)"
base_url = "https://mangaball.com"

[search]
url = "/search?q={query}&page={page}"
item = "div.search-item"
title = "h3 a"
link = "h3 a"
cover = "img.cover"

[details]
description = "div.summary"
author = "div.author span"

[chapters]
item = "ul.chapter-list li"
title = "a.chapter-name"
link = "a.chapter-name"

[pages]
item = "div.reader-images img"
image_attr = "src"
