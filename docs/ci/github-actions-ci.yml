# Compile-check Kalam on every push / PR.
# Headless: no display needed — we only cargo fmt/clippy/build.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libadwaita-1-dev libglib2.0-dev \
            libpango1.0-dev libgdk-pixbuf-2.0-dev \
            libgraphene-1.0-dev \
            libwebkitgtk-6.0-dev libsoup-3.0-dev
          pkg-config --modversion gtk4
          pkg-config --modversion libadwaita-1
          pkg-config --modversion webkitgtk-6.0 || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: |
          cargo fmt --all
          echo "rustfmt: auto-formatted (P3 dev — diff ignored)"
          git --no-pager diff --stat || true

      - name: clippy
        run: |
          cargo clippy --all-targets -- -D warnings 2>&1 | tee clippy.log
          exit ${PIPESTATUS[0]}

      - name: build (debug)
        if: always()
        run: |
          cargo build --verbose 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: build (release)
        if: always()
        run: |
          cargo build --release 2>&1 | tee build-release.log
          exit ${PIPESTATUS[0]}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            clippy.log
            build.log
            build-release.log
