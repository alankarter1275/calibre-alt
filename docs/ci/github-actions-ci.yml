# Compile-check Kalam on every push / PR.
# Headless: no display needed — we only cargo fmt/clippy/build.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (ubuntu)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libadwaita-1-dev libglib2.0-dev \
            libpango1.0-dev libgdk-pixbuf-2.0-dev \
            libgraphene-1.0-dev \
            libwebkitgtk-6.0-dev libsoup-3.0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: rustfmt (auto-fix and push if needed)
        run: |
          cargo fmt --all
          if git diff --quiet; then
            echo "rustfmt: clean"
          else
            echo "rustfmt: formatting and pushing fix"
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add -A
            git commit -m "style: rustfmt auto-fix"
            git push
          fi

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: build (debug)
        run: cargo build --verbose

      - name: build (release)
        run: cargo build --release
